app = "evofarm-rag"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 50
    soft_limit = 25

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[env]
  APP_NAME = "EvoFarm Documentation Assistant"
  LOG_LEVEL = "INFO"
  # These are non-secret defaults. Secrets (JINA_API_KEY, GROQ_API_KEY,
  # DATABASE_URL, JWT_SECRET) are set via `fly secrets set`.
  EMBEDDING_MODEL = "jina-embeddings-v3"
  EMBEDDING_DIMENSIONS = "768"
  GROQ_MODEL = "openai/gpt-oss-120b"
  DEFAULT_COLLECTION = "evofarm-docs"
  SIMILARITY_THRESHOLD = "0.5"